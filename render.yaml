services:
  - type: web
    name: voicecart-ai
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install .
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/products
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ASSEMBLYAI_API_KEY
        sync: false
