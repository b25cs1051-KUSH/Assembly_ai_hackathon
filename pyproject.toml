[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voicecart-ai"
version = "0.1.0"
description = "Voice-driven e-commerce MVP using AssemblyAI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "assemblyai",
    "pydantic",
    "python-dotenv",
    "httpx"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff"
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

